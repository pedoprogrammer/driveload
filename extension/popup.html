<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DriveLoad</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt=""/>
    <div>
      <strong>DriveLoad</strong>
      <span>Public video downloader</span>
    </div>
    <b>2.1</b>
  </header>

  <main>
    <div class="page">
      <span>Current page</span>
      <p id="page-title">Checking this tab...</p>
    </div>

    <button id="download-btn" disabled>
      <span class="button-icon">↓</span>
      <span id="button-label">Download video</span>
    </button>

    <section id="progress" class="hidden" aria-live="polite">
      <div class="track"><div id="progress-fill"></div></div>
      <p id="status">Starting...</p>
    </section>

    <p id="message" class="message hidden" aria-live="polite"></p>
    <p class="note">Public, non-DRM media only. Maximum 500 MB.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
