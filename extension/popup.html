<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DriveLoad</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <div class="brand-mark"><img src="icons/icon48.png" alt=""/></div>
    <div class="brand-copy">
      <strong>DriveLoad</strong>
      <span>Video downloader</span>
    </div>
    <span class="version">v2.1</span>
  </header>

  <main>
    <section class="page">
      <span class="eyebrow">Current page</span>
      <p id="page-title">Checking this tab...</p>
    </section>

    <label class="filename-field" for="filename">
      <span class="eyebrow">File name</span>
      <input id="filename" type="text" maxlength="180" autocomplete="off"
             placeholder="Video name"/>
    </label>

    <button id="download-btn" disabled>
      <span class="button-icon" aria-hidden="true">↓</span>
      <span id="button-label">Download video</span>
    </button>

    <section id="progress" class="hidden" aria-live="polite">
      <div class="progress-copy">
        <p id="status">Starting...</p>
        <span id="progress-value">0%</span>
      </div>
      <div class="track"><div id="progress-fill"></div></div>
      <dl class="media-details">
        <div><dt>Downloaded</dt><dd id="downloaded-size">Starting...</dd></div>
        <div><dt>Total size</dt><dd id="total-size">Estimating...</dd></div>
        <div><dt>Speed</dt><dd id="download-speed">--</dd></div>
        <div><dt>Remaining</dt><dd id="download-eta">--</dd></div>
        <div><dt>Format</dt><dd id="media-format">Detecting...</dd></div>
        <div><dt>Quality</dt><dd id="media-resolution">Detecting...</dd></div>
      </dl>
      <div class="download-controls">
        <button id="pause-btn" class="secondary" type="button">
          <span id="pause-icon" aria-hidden="true">Ⅱ</span>
          <span id="pause-label">Pause</span>
        </button>
        <button id="cancel-btn" class="danger" type="button">
          <span aria-hidden="true">×</span>
          <span>Cancel</span>
        </button>
      </div>
    </section>

    <p id="message" class="message hidden" aria-live="polite"></p>
    <footer>
      <span>Public, non-DRM media</span>
      <span>Up to 1.5 GB</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
